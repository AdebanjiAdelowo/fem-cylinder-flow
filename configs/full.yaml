# Higher-resolution configuration: a 4-level mesh-refinement ladder for the
# steady 2D-1 benchmark, culminating in a mesh fine enough to land inside
# the published reference interval for all three reported quantities
# (verified; see results/2d1_steady_full.txt), and a finer unsteady 2D-2 run.
2d1_mesh_levels:
  - {h_far: 0.040, h_cyl: 0.0080}
  - {h_far: 0.025, h_cyl: 0.0050}
  - {h_far: 0.015, h_cyl: 0.0030}
  - {h_far: 0.010, h_cyl: 0.0020}

2d2_unsteady:
  h_far: 0.03
  h_cyl: 0.005
  dt: 0.005
  t_end: 8.0
